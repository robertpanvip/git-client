[package]
name = "rebased-rs"
version = "0.7.5"
edition = "2024"
description = "A git client UI inspired by Rebased, built with Rust + GPUI"

[dependencies]
gpui-kit = { version = "0.6.1", features = ["component", "assets"] }
gpui-pre = { version = "=0.3.3" }
gpui-pre-platform = { version = "=0.3.3", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
chrono = "0.4"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }
async-channel = "2"
rust-embed = "8"
sys-locale = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 1

[profile.release]
# 体积优先：z 按尺寸启发式优化，配合 thin LTO + strip + abort 得到最小产物。
# diff/log 解析等在后台线程执行，体积模式的性能影响对交互无感。
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = "symbols"
# abort 而非 unwind：去掉解包代码与 unwind 表显著减小体积。
# panic hook 在 abort 前仍会被调用，panic.log 崩溃兜底保持有效。
panic = "abort"

# 本地补丁：上游 destination_list.rs 使用 windows crate 的 u_strlen，
# 该符号静态链接系统 icuuc.dll（Windows 10 1803 起随系统分发），
# 导致 Windows 10 1709 等旧系统加载即失败。改为纯 Rust 查找 NUL 终止符。
[patch.crates-io]
gpui-pre-windows = { path = "patches/gpui-pre-windows-0.3.3" }
