name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebased-rs
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libfontconfig-dev \
            libfreetype-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Configure Tencent cargo mirror (rsproxy)
        run: |
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'

          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"
          EOF

      - name: Build release binary
        run: cargo build --release

      - name: Package artifacts
        run: |
          cp target/release/rebased-rs rebased-rs-linux-x86_64
          tar -czf rebased-rs-linux-x86_64.tar.gz rebased-rs-linux-x86_64
          sha256sum rebased-rs-linux-x86_64 rebased-rs-linux-x86_64.tar.gz > checksums.txt

      - name: Upload workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: rebased-rs-linux-x86_64
          path: |
            rebased-rs-linux-x86_64
            rebased-rs-linux-x86_64.tar.gz
            checksums.txt

      - name: Publish GitHub Release (tag runs)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rebased-rs-linux-x86_64
            rebased-rs-linux-x86_64.tar.gz
            checksums.txt
          generate_release_notes: true
