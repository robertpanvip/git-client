name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: darwin-aarch64
          - os: macos-latest
            target: darwin-x86_64
          - os: windows-latest
            target: windows-x86_64
    defaults:
      run:
        shell: bash
        working-directory: rebased-rs
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target == 'darwin-x86_64' && 'x86_64-apple-darwin' || '' }}

      - name: Configure Tencent cargo mirror (rsproxy)
        run: printf '[source.crates-io]\nreplace-with = "rsproxy-sparse"\n\n[source.rsproxy-sparse]\nregistry = "sparse+https://rsproxy.cn/index/"\n' > ~/.cargo/config.toml

      - name: Build release binary
        run: |
          if [ "${{ matrix.target }}" = "darwin-x86_64" ]; then
            cargo build --release --target x86_64-apple-darwin
            mkdir -p target/release
            cp target/x86_64-apple-darwin/release/rebased-rs target/release/rebased-rs
          else
            cargo build --release
          fi

      - name: Package
        run: |
          bin="rebased-rs-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            bin="${bin}.exe"
            cp target/release/rebased-rs.exe "$bin"
            7z a "${bin%.exe}.zip" "$bin"
            sha256sum "${bin%.exe}.zip" > "${bin%.exe}.zip.sha256"
            rm "$bin"
          else
            cp target/release/rebased-rs "$bin"
            tar -czf "$bin.tar.gz" "$bin"
            sha256sum "$bin" "$bin.tar.gz" > "${bin%.tar.gz}.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rebased-rs-${{ matrix.target }}
          path: |
            rebased-rs/rebased-rs-*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rebased-rs-*
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
